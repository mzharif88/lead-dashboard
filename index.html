<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Engine — StaffAny</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #080b10;
  --bg1: #0d1117;
  --bg2: #131a24;
  --bg3: #1a2333;
  --border: rgba(99,140,185,0.12);
  --border-hi: rgba(99,140,185,0.25);
  --green: #00d4a0;
  --green-dim: rgba(0,212,160,0.12);
  --green-glow: rgba(0,212,160,0.25);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --red: #f43f5e;
  --red-dim: rgba(244,63,94,0.1);
  --blue: #38bdf8;
  --blue-dim: rgba(56,189,248,0.1);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.1);
  --text0: #e2eaf5;
  --text1: #8fa3bf;
  --text2: #4d6480;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --serif: 'DM Serif Display', serif;
}

body { font-family: var(--sans); background: var(--bg0); color: var(--text0); min-height: 100vh; overflow-x: hidden; }

/* ── LAYOUT ── */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--green);
  letter-spacing: -0.5px;
}
.logo-sub {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 2px;
  font-family: var(--mono);
}

.nav { padding: 16px 12px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text1);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg3); color: var(--text0); }
.nav-item.active { background: var(--green-dim); color: var(--green); }
.nav-icon { font-size: 15px; width: 18px; text-align: center; }

.sidebar-stats {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg0);
}
.ss-title { font-size: 10px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
.ss-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; }
.ss-label { font-size: 12px; color: var(--text2); }
.ss-val { font-family: var(--mono); font-size: 13px; color: var(--green); font-weight: 600; }

/* ── MAIN ── */
.main { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 5;
}
.page-title { font-family: var(--serif); font-size: 20px; color: var(--text0); flex: 1; }
.search-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  color: var(--text0);
  font-family: var(--sans);
  font-size: 13px;
  width: 240px;
  outline: none;
  transition: border 0.2s;
}
.search-box:focus { border-color: var(--green); }
.search-box::placeholder { color: var(--text2); }

.filter-row {
  display: flex; gap: 8px; align-items: center;
  padding: 12px 28px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-chip {
  font-size: 12px; font-family: var(--mono);
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text1);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--border-hi); color: var(--text0); }
.filter-chip.active { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.results-count { font-family: var(--mono); font-size: 11px; color: var(--text2); margin-left: auto; }

.content { flex: 1; overflow-x: auto; }

/* ── TABLE ── */
.table-wrap { min-width: 900px; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--bg2); position: sticky; top: 0; z-index: 3; }
th {
  padding: 11px 16px;
  font-size: 11px; font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text2);
  text-align: left;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
th:hover { color: var(--text1); }
th.sorted { color: var(--green); }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
tbody tr:hover { background: var(--bg3); }
td { padding: 12px 16px; font-size: 13px; vertical-align: top; }

.td-company { min-width: 180px; }
.co-name { font-weight: 600; color: var(--text0); font-size: 13.5px; }
.co-sub { font-size: 11px; color: var(--text2); font-family: var(--mono); margin-top: 2px; }

.td-contacts { min-width: 200px; }
.primary-contact { display: flex; flex-direction: column; gap: 2px; }
.pc-name { font-weight: 500; color: var(--text0); font-size: 13px; }
.pc-role { font-size: 11px; color: var(--text2); }
.pc-phone { font-family: var(--mono); font-size: 11px; color: var(--green); margin-top: 3px; }
.pc-email { font-family: var(--mono); font-size: 11px; color: var(--blue); }
.extra-contacts-pill {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 6px;
  background: var(--purple-dim);
  border: 1px solid rgba(167,139,250,0.2);
  border-radius: 20px;
  padding: 2px 8px;
  font-size: 10px; font-family: var(--mono);
  color: var(--purple);
  cursor: pointer;
}
.extra-contacts-pill:hover { background: rgba(167,139,250,0.2); }

.badge {
  display: inline-block;
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-family: var(--mono); font-weight: 500;
}
.badge-new { background: var(--green-dim); color: var(--green); }
.badge-contacted { background: var(--blue-dim); color: var(--blue); }
.badge-qualified { background: var(--amber-dim); color: var(--amber); }
.badge-disqualified { background: var(--red-dim); color: var(--red); }
.badge-target { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-glow); }
.badge-notarget { background: var(--bg3); color: var(--text2); }

.conf-wrap { display: flex; align-items: center; gap: 8px; }
.conf-bar { width: 52px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.conf-fill { height: 100%; border-radius: 2px; }
.conf-num { font-family: var(--mono); font-size: 11px; color: var(--text2); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8,11,16,0.85);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border-hi);
  border-radius: 14px;
  width: 680px; max-width: 95vw;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-co { font-family: var(--serif); font-size: 22px; color: var(--text0); }
.modal-meta { font-size: 12px; color: var(--text2); font-family: var(--mono); margin-top: 4px; }
.modal-close {
  background: var(--bg3); border: none; color: var(--text1);
  width: 30px; height: 30px; border-radius: 8px;
  cursor: pointer; font-size: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--red-dim); color: var(--red); }

.modal-body { padding: 20px 24px; }
.modal-section { margin-bottom: 22px; }
.modal-section-title {
  font-size: 10px; font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text2); margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* Contact cards in modal */
.contact-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  position: relative;
}
.contact-card.primary { border-color: rgba(0,212,160,0.25); }
.contact-card.primary::before {
  content: 'PRIMARY';
  position: absolute; top: 10px; right: 12px;
  font-size: 9px; font-family: var(--mono);
  color: var(--green); letter-spacing: 0.1em;
}
.cc-name { font-weight: 600; font-size: 14px; color: var(--text0); }
.cc-role { font-size: 12px; color: var(--text2); margin-top: 2px; }
.cc-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-top: 12px;
}
.cc-field { }
.cc-field-label { font-size: 10px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
.cc-field-val {
  font-family: var(--mono); font-size: 12px; color: var(--text0);
  margin-top: 3px; word-break: break-all;
}
.cc-field-val.green { color: var(--green); }
.cc-field-val.blue { color: var(--blue); }
.cc-field-val.dim { color: var(--text2); font-style: italic; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.info-field { background: var(--bg3); border-radius: 8px; padding: 10px 14px; }
.if-label { font-size: 10px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
.if-val { font-size: 13px; color: var(--text0); margin-top: 4px; }
.if-val.mono { font-family: var(--mono); font-size: 12px; }

.notes-box {
  background: var(--bg3); border-radius: 8px; padding: 12px 14px;
  font-size: 13px; color: var(--text1); line-height: 1.6;
}
.pitch-box {
  background: var(--green-dim); border: 1px solid var(--green-glow);
  border-radius: 8px; padding: 12px 14px;
  font-size: 13px; color: var(--text0); line-height: 1.6;
}
.backstory-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px;
  font-size: 13px; color: var(--text1); line-height: 1.75;
  white-space: pre-wrap;
}

/* ── ANALYTICS ── */
.analytics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; padding: 24px 28px 0;
}
.kpi-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px;
}
.kpi-label { font-size: 11px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
.kpi-val { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--green); margin-top: 6px; }
.kpi-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 28px 28px; }
.chart-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px;
}
.chart-title { font-size: 12px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }

.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { font-size: 12px; color: var(--text1); width: 100px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: var(--green); }
.bar-num { font-family: var(--mono); font-size: 11px; color: var(--text2); width: 28px; text-align: right; flex-shrink: 0; }

.donut-wrap { display: flex; align-items: center; gap: 24px; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text1); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── LOADING / EMPTY ── */
.loading-state { padding: 60px; text-align: center; color: var(--text2); font-family: var(--mono); font-size: 13px; }
.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }
</style>
</head>
<body>

<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">Lead Engine</div>
      <div class="logo-sub">StaffAny · KL</div>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="setTab('leads')" id="nav-leads">
        <span class="nav-icon">⬡</span> All Leads
      </div>
      <div class="nav-item" onclick="setTab('targets')" id="nav-targets">
        <span class="nav-icon">◎</span> Target Accounts
      </div>
      <div class="nav-item" onclick="setTab('contacts')" id="nav-contacts">
        <span class="nav-icon">◈</span> Contacts
      </div>
      <div class="nav-item" onclick="setTab('analytics')" id="nav-analytics">
        <span class="nav-icon">◻</span> Analytics
      </div>
    </nav>
    <div class="sidebar-stats">
      <div class="ss-title">Quick Stats</div>
      <div class="ss-row"><span class="ss-label">Total leads</span><span class="ss-val" id="st-total">—</span></div>
      <div class="ss-row"><span class="ss-label">Target accounts</span><span class="ss-val" id="st-targets">—</span></div>
      <div class="ss-row"><span class="ss-label">With phone</span><span class="ss-val" id="st-phone">—</span></div>
      <div class="ss-row"><span class="ss-label">Multi-contact</span><span class="ss-val" id="st-multi">—</span></div>
      <div class="ss-row"><span class="ss-label">With email</span><span class="ss-val" id="st-email">—</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="page-title" id="page-title">All Leads</div>
      <input class="search-box" id="search" placeholder="Search company, name, email…" oninput="applyFilters()">
    </div>

    <div class="filter-row" id="filter-row">
      <div class="filter-chip active" onclick="setFilter('all',this)" data-filter="all">All</div>
      <div class="filter-chip" onclick="setFilter('target',this)" data-filter="target">Target ICP</div>
      <div class="filter-chip" onclick="setFilter('phone',this)" data-filter="phone">Has Phone</div>
      <div class="filter-chip" onclick="setFilter('email',this)" data-filter="email">Has Email</div>
      <div class="filter-chip" onclick="setFilter('multi',this)" data-filter="multi">Multi-contact</div>
      <div class="filter-sep"></div>
      <div class="filter-chip" onclick="setFilter('new',this)" data-filter="new">New</div>
      <div class="filter-chip" onclick="setFilter('contacted',this)" data-filter="contacted">Contacted</div>
      <div class="filter-chip" onclick="setFilter('qualified',this)" data-filter="qualified">Qualified</div>
      <span class="results-count" id="results-count"></span>
    </div>

    <div class="content" id="content">
      <div class="loading-state pulse">Connecting to Supabase…</div>
    </div>
  </div>
</div>

<!-- LEAD DETAIL MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-co" id="m-company"></div>
        <div class="modal-meta" id="m-meta"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const SUPABASE_URL = 'https://wxhfezgacgrwidjeboye.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGZlemdhY2dyd2lkamVib3llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODc1NzgsImV4cCI6MjA5MDk2MzU3OH0.04UeQDQd3C8wrecouUP6wZDcVEYMZRWNpZyNb7lTmZE';
// ─────────────────────────────────────────────────────────────

let allLeads = [];
let filtered = [];
let currentTab = 'leads';
let currentFilter = 'all';
let sortCol = 'created_at';
let sortDir = 'desc';

// ── FETCH ────────────────────────────────────────────────────
async function fetchLeads() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/leads_master?select=*&order=created_at.desc.nullslast`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(res.status);
    allLeads = await res.json();
    updateSidebar();
    applyFilters();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="loading-state" style="color:#f43f5e">⚠ Failed to connect to Supabase.<br><span style="font-size:11px;color:var(--text2)">Check SUPABASE_KEY in dashboard.html</span></div>`;
  }
}

function updateSidebar() {
  document.getElementById('st-total').textContent = allLeads.length;
  document.getElementById('st-targets').textContent = allLeads.filter(l=>l.target_account).length;
  document.getElementById('st-phone').textContent = allLeads.filter(l=>l.mobile_number||l.general_line).length;
  document.getElementById('st-multi').textContent = allLeads.filter(l=>l.additional_contacts&&l.additional_contacts.length>0).length;
  document.getElementById('st-email').textContent = allLeads.filter(l=>l.email).length;
}

// ── TABS ──────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');
  const titles = { leads:'All Leads', targets:'Target Accounts', contacts:'Contact View', analytics:'Analytics' };
  document.getElementById('page-title').textContent = titles[tab] || tab;

  const fr = document.getElementById('filter-row');
  fr.style.display = tab === 'analytics' ? 'none' : 'flex';

  if (tab === 'analytics') { renderAnalytics(); return; }
  applyFilters();
}

// ── FILTERS ──────────────────────────────────────────────────
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();

  let base = allLeads;
  if (currentTab === 'targets') base = allLeads.filter(l=>l.target_account);

  // Text search
  filtered = base.filter(l => {
    if (!q) return true;
    const name = `${l.first_name||''} ${l.last_name||''}`.toLowerCase();
    const co = (l.company_name||'').toLowerCase();
    const email = (l.email||'').toLowerCase();
    const phone = (l.mobile_number||l.general_line||'').toLowerCase();
    const extras = JSON.stringify(l.additional_contacts||[]).toLowerCase();
    return co.includes(q) || name.includes(q) || email.includes(q) || phone.includes(q) || extras.includes(q);
  });

  // Chip filter
  if (currentFilter === 'target') filtered = filtered.filter(l=>l.target_account);
  else if (currentFilter === 'phone') filtered = filtered.filter(l=>l.mobile_number||l.general_line);
  else if (currentFilter === 'email') filtered = filtered.filter(l=>l.email);
  else if (currentFilter === 'multi') filtered = filtered.filter(l=>l.additional_contacts&&l.additional_contacts.length>0);
  else if (currentFilter === 'new') filtered = filtered.filter(l=>(l.lead_status||'New').toLowerCase()==='new');
  else if (currentFilter === 'contacted') filtered = filtered.filter(l=>(l.lead_status||'').toLowerCase()==='contacted');
  else if (currentFilter === 'qualified') filtered = filtered.filter(l=>(l.lead_status||'').toLowerCase()==='qualified');

  document.getElementById('results-count').textContent = `${filtered.length} record${filtered.length!==1?'s':''}`;

  if (currentTab === 'contacts') { renderContactsView(); return; }
  renderTable();
}

// ── SORT ──────────────────────────────────────────────────────
function sort(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'desc'; }
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sorted'));
  document.querySelector(`th[data-col="${col}"]`)?.classList.add('sorted');
  filtered.sort((a,b) => {
    let av = a[col]??'', bv = b[col]??'';
    if (typeof av === 'boolean') av = av ? 1 : 0, bv = bv ? 1 : 0;
    if (av < bv) return sortDir==='asc'?-1:1;
    if (av > bv) return sortDir==='asc'?1:-1;
    return 0;
  });
  renderTable();
}

// ── RENDER TABLE ──────────────────────────────────────────────
function renderTable() {
  const el = document.getElementById('content');

  if (!filtered.length) {
    el.innerHTML = `<div class="loading-state">No leads found</div>`;
    return;
  }

  el.innerHTML = `
  <div class="table-wrap">
  <table>
    <thead><tr>
      <th data-col="company_name" onclick="sort('company_name')">Company</th>
      <th data-col="primary_contact">Primary Contact</th>
      <th data-col="mobile_number" onclick="sort('mobile_number')">Phone</th>
      <th data-col="number_of_headcount" onclick="sort('number_of_headcount')">Headcount</th>
      <th data-col="target_account" onclick="sort('target_account')">ICP</th>
      <th data-col="confidence_score" onclick="sort('confidence_score')">Confidence</th>
      <th data-col="lead_status" onclick="sort('lead_status')">Status</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map((l,i) => {
    const picName = [l.title, l.first_name, l.last_name].filter(Boolean).join(' ') || '—';
    const phone = l.mobile_number || l.general_line || null;
    const extras = Array.isArray(l.additional_contacts) ? l.additional_contacts : [];
    const conf = l.confidence_score || 0;
    const confColor = conf >= 0.7 ? 'var(--green)' : conf >= 0.4 ? 'var(--amber)' : 'var(--red)';
    const status = (l.lead_status || 'New').toLowerCase();

    const extraPill = extras.length > 0
      ? `<div class="extra-contacts-pill" onclick="event.stopPropagation(); openModal(${i})">+${extras.length} more contact${extras.length>1?'s':''}</div>`
      : '';

    return `<tr onclick="openModal(${i})">
      <td class="td-company">
        <div class="co-name">${esc(l.company_name)}</div>
        <div class="co-sub">${esc(l.industry||'')} ${l.management_model ? '· '+l.management_model.replace('_',' ') : ''}</div>
      </td>
      <td class="td-contacts">
        <div class="primary-contact">
          <div class="pc-name">${esc(picName)}</div>
          ${l.title ? '' : ''}<div class="pc-role" style="color:var(--text2);font-size:11px">${esc(l.pic_name_original && l.pic_name_original !== picName ? l.pic_name_original : '')}</div>
          ${phone ? `<div class="pc-phone">${esc(phone)}</div>` : ''}
          ${l.email ? `<div class="pc-email">${esc(l.email)}</div>` : ''}
          ${extraPill}
        </div>
      </td>
      <td style="font-family:var(--mono);font-size:12px;color:${phone?'var(--green)':'var(--text2)'}">
        ${phone ? esc(phone) : '—'}
      </td>
      <td style="font-family:var(--mono);font-size:12px">${esc(l.number_of_headcount||'—')}</td>
      <td><span class="badge ${l.target_account ? 'badge-target' : 'badge-notarget'}">${l.target_account?'✓ ICP':'—'}</span></td>
      <td>
        <div class="conf-wrap">
          <div class="conf-bar"><div class="conf-fill" style="width:${Math.round(conf*100)}%;background:${confColor}"></div></div>
          <span class="conf-num">${Math.round(conf*100)}%</span>
        </div>
      </td>
      <td><span class="badge badge-${status}">${l.lead_status||'New'}</span></td>
    </tr>`;
  }).join('');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// ── ANALYTICS ──────────────────────────────────────────────────
function renderAnalytics() {
  const el = document.getElementById('content');
  const total = allLeads.length;
  const targets = allLeads.filter(l=>l.target_account).length;
  const withPhone = allLeads.filter(l=>l.mobile_number||l.general_line).length;
  const withEmail = allLeads.filter(l=>l.email).length;
  const multiContact = allLeads.filter(l=>Array.isArray(l.additional_contacts)&&l.additional_contacts.length>0).length;
  const totalExtraContacts = allLeads.reduce((s,l)=>s+(Array.isArray(l.additional_contacts)?l.additional_contacts.length:0),0);

  const statusCounts = {};
  const hcCounts = {};
  allLeads.forEach(l => {
    const s = l.lead_status||'New'; statusCounts[s]=(statusCounts[s]||0)+1;
    const h = l.number_of_headcount||'Unknown'; hcCounts[h]=(hcCounts[h]||0)+1;
  });

  const statusColors = { New:'var(--green)', Contacted:'var(--blue)', Qualified:'var(--amber)', Disqualified:'var(--red)' };

  el.innerHTML = `
  <div class="analytics-grid">
    <div class="kpi-card"><div class="kpi-label">Total Leads</div><div class="kpi-val">${total}</div><div class="kpi-sub">in leads_master</div></div>
    <div class="kpi-card"><div class="kpi-label">Target Accounts</div><div class="kpi-val">${targets}</div><div class="kpi-sub">${Math.round(targets/total*100)||0}% of total</div></div>
    <div class="kpi-card"><div class="kpi-label">Total Contacts</div><div class="kpi-val">${total + totalExtraContacts}</div><div class="kpi-sub">${multiContact} multi-contact leads</div></div>
    <div class="kpi-card"><div class="kpi-label">Phone Coverage</div><div class="kpi-val">${Math.round(withPhone/total*100)||0}%</div><div class="kpi-sub">${withPhone} leads with phone</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-title">By Lead Status</div>
      <div class="donut-wrap">
        <svg width="100" height="100" viewBox="0 0 100 100">${buildDonut(statusCounts, statusColors)}</svg>
        <div class="donut-legend">
          ${Object.entries(statusCounts).map(([k,v])=>`
          <div class="legend-row">
            <div class="legend-dot" style="background:${statusColors[k]||'var(--text2)'}"></div>
            <span>${k}</span><span style="font-family:var(--mono);font-size:11px;color:var(--text2);margin-left:auto;padding-left:12px">${v}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">By Headcount Range</div>
      ${Object.entries(hcCounts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`
      <div class="bar-row">
        <div class="bar-label">${k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/total*100)}%"></div></div>
        <div class="bar-num">${v}</div>
      </div>`).join('')}
    </div>
    <div class="chart-card">
      <div class="chart-title">Contact Coverage</div>
      ${[
        ['Has mobile number', withPhone, 'var(--green)'],
        ['Has email', withEmail, 'var(--blue)'],
        ['Multi-contact lead', multiContact, 'var(--purple)'],
        ['Target ICP', targets, 'var(--amber)'],
      ].map(([label, val, color])=>`
      <div class="bar-row">
        <div class="bar-label">${label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/total*100)}%;background:${color}"></div></div>
        <div class="bar-num">${val}</div>
      </div>`).join('')}
    </div>
    <div class="chart-card">
      <div class="chart-title">Contact Depth</div>
      <div style="padding:10px 0">
        ${allLeads.filter(l=>Array.isArray(l.additional_contacts)&&l.additional_contacts.length>0)
          .sort((a,b)=>(b.additional_contacts?.length||0)-(a.additional_contacts?.length||0))
          .slice(0,6).map(l=>`
        <div class="bar-row">
          <div class="bar-label">${esc(l.company_name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(l.additional_contacts.length+1)*20)}%;background:var(--purple)"></div></div>
          <div class="bar-num">${(l.additional_contacts.length||0)+1}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function buildDonut(counts, colors) {
  const vals = Object.entries(counts);
  const total = vals.reduce((s,[,v])=>s+v,0);
  let offset = 25;
  const r = 35, cx = 50, cy = 50, circ = 2*Math.PI*r;
  return vals.map(([k,v]) => {
    const dash = (v/total)*circ;
    const gap = circ - dash;
    const color = colors[k]||'#555';
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset*circ/100}" />`;
    offset += (v/total)*100;
    return el;
  }).join('') + `<circle cx="${cx}" cy="${cy}" r="22" fill="var(--bg2)"/>
  <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="var(--text0)">${total}</text>`;
}

// ── UTILS ──────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

fetchLeads();
setInterval(fetchLeads, 60000); // auto-refresh every 60s
